name: Build

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test windows/MonAlbumPc.slnx -c Release

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME --no-daemon

      # The Windows app serves this APK to phones; the JSON tells it which version it is.
      - name: Package APK
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/debug/app-debug.apk ../dist/monalbumpc.apk
          printf '{"versionCode":%s,"versionName":"%s","commit":"%s"}\n' "$VERSION_CODE" "$VERSION_NAME" "$GITHUB_SHA" > ../dist/monalbumpc.apk.json

      - uses: actions/upload-artifact@v4
        with:
          name: monalbumpc-debug-apk
          path: dist/*
          if-no-files-found: error

      # Public pre-release so the latest APK can be downloaded without a GitHub token.
      - name: Publish android-dev pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-dev --yes --cleanup-tag || true
          gh release create android-dev ../dist/monalbumpc.apk ../dist/monalbumpc.apk.json \
            --prerelease --target "$GITHUB_SHA" --title "Android dev $VERSION_NAME" \
            --notes "APK de développement construit depuis develop ($GITHUB_SHA)."
