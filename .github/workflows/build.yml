name: Build

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test windows/MonAlbumPc.slnx -c Release

  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # The release key lives in the repository secrets; without them (forks, pull requests) the APK is unsigned.
      - name: Decode release key
        env:
          KEYSTORE_BASE64: ${{ secrets.MONALBUMPC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "MONALBUMPC_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Test and build release APK
        env:
          MONALBUMPC_KEYSTORE_PASSWORD: ${{ secrets.MONALBUMPC_KEYSTORE_PASSWORD }}
        run: gradle :app:testReleaseUnitTest :app:assembleRelease -PversionCode=$VERSION_CODE -PversionName=$VERSION_NAME --no-daemon

      # The Windows app serves this APK to phones; the JSON tells it which version it is.
      - name: Package APK
        run: |
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release*.apk ../dist/monalbumpc.apk
          printf '{"versionCode":%s,"versionName":"%s","commit":"%s"}\n' "$VERSION_CODE" "$VERSION_NAME" "$GITHUB_SHA" > ../dist/monalbumpc.apk.json

      - uses: actions/upload-artifact@v4
        with:
          name: monalbumpc-apk
          path: dist/*
          if-no-files-found: error

      # Public pre-release so the latest APK can be downloaded without a GitHub token.
      - name: Publish android-dev pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Never publish an APK that phones could not update to.
          test -n "$MONALBUMPC_KEYSTORE" || { echo "::error::Release key secrets missing"; exit 1; }
          gh release delete android-dev --yes --cleanup-tag || true
          gh release create android-dev ../dist/monalbumpc.apk ../dist/monalbumpc.apk.json \
            --prerelease --target "$GITHUB_SHA" --title "Android dev $VERSION_NAME" \
            --notes "APK construit depuis develop ($GITHUB_SHA), signé avec la clé de release."

  nas:
    runs-on: ubuntu-latest
    needs: android
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # The NAS serves the same APK as the Windows app.
      - uses: actions/download-artifact@v4
        with:
          name: monalbumpc-apk
          path: nas/android

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/lgm42/mon-album-pc
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=semver,pattern={{version}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: nas/Dockerfile
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
